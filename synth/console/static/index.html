<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Synth Console</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to workspace</a>

  <header class="topbar" role="banner">
    <div class="brand" aria-label="Synth Console">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">SYNTH</span>
      <span class="brand-sub">CONSOLE</span>
    </div>

    <div class="topbar-run">
      <label for="runSelect" class="cap">Run</label>
      <select id="runSelect" aria-label="Select run">
        <option value="">Loading runs…</option>
      </select>
      <button type="button" class="icon-btn" id="refreshBtn" aria-label="Refresh data" title="Refresh">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>

    <div class="topbar-right">
      <span class="chip demo-badge" id="demoBadge" style="--c:#fab219" title="Server started in demo mode: run control is disabled" hidden><i class="dot"></i>DEMO · read-only</span>
      <a href="#/run" class="job-indicator" id="jobIndicator" aria-live="polite" title="Background jobs">
        <span class="job-dot" aria-hidden="true"></span>
        <span id="jobIndicatorText">No jobs running</span>
      </a>
      <button type="button" class="icon-btn" id="inspectorToggle" aria-label="Toggle inspector panel" aria-controls="inspector" aria-expanded="true" title="Toggle inspector">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" fill="none" stroke="currentColor"/><path d="M10 2.5v11" stroke="currentColor"/></svg>
      </button>
    </div>
  </header>

  <nav class="sidenav" aria-label="Views">
    <a href="#/garage" data-view="garage" title="Garage — assemble engines: builds and slots">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="5" width="8" height="6.5" rx="1"/><path d="M5.5 5V3.2h4V5M11.5 7h1.6l1.4-1.4v4.8L13.1 9h-1.6M3.5 8H1.5M1.5 6.5v3"/><circle cx="7.5" cy="8.2" r="1.3"/></svg>
      <span>Garage</span>
    </a>
    <a href="#/servers" data-view="servers" title="Servers — start or connect model servers">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="4.5" rx="1"/><rect x="2" y="9.5" width="12" height="4.5" rx="1"/><path d="M4.5 4.25h.01M4.5 11.75h.01M8 4.25h4M8 11.75h4" stroke-linecap="round" stroke-width="1.6"/></svg>
      <span>Servers</span>
    </a>
    <a href="#/ontology" data-view="ontology" title="Ontology — what Synth extracts: entities, relations, rules">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="6" y="1.5" width="4" height="3" rx=".6"/><rect x="1.5" y="11.5" width="4" height="3" rx=".6"/><rect x="10.5" y="11.5" width="4" height="3" rx=".6"/><path d="M8 4.5v3.5M3.5 11.5V8h9v3.5"/></svg>
      <span>Ontology</span>
    </a>
    <a href="#/run" data-view="run" title="Run — corpus, run setup, live progress, jobs">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5l9 5.5-9 5.5z"/></svg>
      <span>Run</span>
    </a>
    <a href="#/dyno" data-view="dyno" title="Dyno — measure and compare engine performance">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.2 11.5a6 6 0 1 1 11.6 0"/><path d="M8 10.2l3-4.2"/><circle cx="8" cy="10.4" r="1.1"/><path d="M3.8 6.2l.9.6M8 3.6v1.1M12.2 6.2l-.9.6"/></svg>
      <span>Dyno</span>
    </a>
    <a href="#/gearbox" data-view="gearbox" title="Gearbox — what every model was asked, thought and answered, and what survived">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.3"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
      <span>Gearbox</span>
    </a>
    <span class="nav-sep" role="separator" aria-hidden="true"></span>
    <a href="#/graph" data-view="explore" title="Explore — graph, documents and review for the selected run">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="4" r="2"/><circle cx="12.5" cy="3.5" r="2"/><circle cx="8" cy="12.5" r="2"/><path d="M5.3 4.6l5.4-.8M4.6 5.7l2.4 5M11.6 5.3l-2.6 5.4"/></svg>
      <span>Explore</span>
    </a>
    <a href="#/data" data-view="data" title="Data — stores, ledgers and outputs">
      <svg viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="3.5" rx="5.5" ry="2"/><path d="M2.5 3.5v9c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2v-9M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/></svg>
      <span>Data</span>
    </a>
  </nav>

  <main id="workspace" class="workspace" tabindex="-1" aria-live="off"></main>

  <aside id="inspector" class="inspector" aria-label="Inspector">
    <div class="insp-head">
      <button type="button" class="icon-btn" id="inspBack" aria-label="Back to previous inspected object" title="Back" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <span class="cap" id="inspKind">Inspector</span>
      <button type="button" class="icon-btn" id="inspClose" aria-label="Collapse inspector" title="Collapse">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <div class="insp-body" id="inspBody"></div>
  </aside>

  <footer class="statusbar" id="statusbar" role="contentinfo">
    <span id="sbDb">db —</span>
    <span id="sbCounts"></span>
    <span id="sbRun"></span>
    <span id="sbGraphLib">graph lib: loading</span>
    <span class="sb-right" id="sbSync"></span>
  </footer>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <dialog id="dlg" class="dlg" aria-labelledby="dlgTitle">
    <form method="dialog" id="dlgForm">
      <div class="dlg-head"><span id="dlgTitle"></span></div>
      <div class="dlg-body" id="dlgBody"></div>
      <div class="dlg-actions">
        <button type="button" class="btn" id="dlgCancel">Cancel</button>
        <button type="submit" class="btn primary" id="dlgOk">OK</button>
      </div>
    </form>
  </dialog>
</body>
</html>
